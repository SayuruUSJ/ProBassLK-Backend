server:
  port: 8080
  servlet:
#    context-path: /api
    session:
      timeout: 30m
      cookie:
        name: JSESSIONID
        path: /
        http-only: true
        secure: false
        same-site: Lax

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/workbridge?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: 12345
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 30000
      pool-name: WorkbridgeHikariPool

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # ✅ Option 1: Use this for Spring Boot 2.x / Hibernate 5


        # ✅ Option 2: Use this for Spring Boot 3.x / Hibernate 6
        # dialect: org.hibernate.dialect.MySQLDialect

        # ✅ Option 3: Remove dialect completely for auto-detection
        # dialect: (removed)

        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false

  # Security Configuration
  security:
    user:
      name: admin
      password: admin123
    remember-me:
      key: workbridge-remember-me-secret-key
      token-validity-seconds: 86400

  # CORS Configuration
  web:
    cors:
      allowed-origins:
        - http://localhost:3000
        - http://localhost:4200
        - http://localhost:8080
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowed-headers:
        - "*"
      allow-credentials: true
      max-age: 3600

  application:
    name: workbridge-marketplace

# Logging Configuration
logging:
  level:
    root: INFO
    lk.workbridge.marketplace: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  file:
    name: logs/application.log
    max-size: 10MB
    max-history: 30