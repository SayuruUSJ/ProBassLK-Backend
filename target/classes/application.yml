server:
  port: 8081
  servlet:
    session:
      timeout: 30m
      cookie:
        name: JSESSIONID
        path: /
        http-only: true
        secure: false
        same-site: Lax

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/workbridge
    username: root
    password: 12345
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 30000
      pool-name: WorkbridgeHikariPool

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: tumiraduli@gmail.com
    password: "ghip qzcl kedi hyug"
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    user:
      name: admin
      password: admin123
    remember-me:
      key: workbridge-remember-me-secret-key
      token-validity-seconds: 86400

  web:
    cors:
      allowed-origins:
        - http://localhost:3000
        - http://localhost:4200
        - http://localhost:8080
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowed-headers:
        - "*"
      allow-credentials: true
      max-age: 3600

  application:
    name: workbridge-marketplace

